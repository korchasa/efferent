<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app in one mark: a phone hands what it has to an agent, one way only.
       Solid shapes and flat colours — thin outlines mush at 40 px, and a
       gradient renders slightly differently on every machine, which makes an
       icon nobody can review. -->
  <rect width="1024" height="1024" fill="#0F2233"/>
  <g fill="#FFFFFF">
    <rect x="106" y="272" width="250" height="480" rx="56"/>
    <path d="M 412 512 L 516 512" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <path d="M 480 466 L 534 512 L 480 558" fill="none" stroke="#FFFFFF" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 758 352 Q 790 480 918 512 Q 790 544 758 672 Q 726 544 598 512 Q 726 480 758 352 Z"/>
  </g>
  <!-- The speaker slot is the one detail that turns a rounded rectangle into a
       phone. Cut in the background colour so the shape stays a single solid. -->
  <rect x="186" y="318" width="90" height="22" rx="11" fill="#0F2233"/>
</svg>

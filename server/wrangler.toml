# The bucket service. Deployed by hand for now:
#   wrangler r2 bucket create efferent
#   wrangler deploy --config server/wrangler.toml
#
# Nothing secret lives here. The service holds ciphertext and a writer's public
# key, and there is no configuration that could give it more.

name = "efferent"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "efferent"

[observability]
enabled = true

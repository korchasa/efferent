# Scans the whole history for committed secrets on every push and pull request.
#
# This is a check and nothing else. It builds nothing, signs nothing and uploads
# nowhere — a push to this repository must never be able to reach a user.
#
# The scan reads history rather than the checked-out files, because that is
# where the damage lives: a key deleted in a later commit is still published by
# the one that added it. Rules and the reasons behind them are in
# `.gitleaks.toml`; the ones that matter here are not the default cloud tokens
# but this project's own reading and writer keys, which travel as bare base64
# with no PEM armour and which the stock ruleset does not recognise.
#
# gitleaks is fetched as a pinned, checksummed binary rather than through the
# marketplace action: the action asks organisations for a licence key and
# reports back to its author, and neither belongs in a check this small.

name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the shallow default. Without this the scan
          # sees one commit and passes on a repository full of keys.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
